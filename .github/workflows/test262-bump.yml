name: Test262 Bump

# Bumps the test262 submodule, runs the Temporal suite against it, and opens a
# PR carrying the failure report.
#
# Two things shape this file.
#
# 1. It stays silent on most weeks. A gate decides whether the new test262
#    commits can change our result at all, and only then does the work. The
#    point is not runner minutes, which are free on a public repo. It is to
#    keep a PR out of the inbox on a week where nothing we test moved.
#
# 2. It runs as two jobs, and the split is a security boundary, not tidiness.
#    The `test` job executes test262, which is third-party code on a moving
#    ref that nobody reviews. It holds no write scopes and no git credentials.
#    The `publish` job holds the write scopes, and it never installs or
#    executes anything from test262. It moves the submodule pointer with
#    `git update-index`, so it never even fetches that repository.

on:
  schedule:
    # Weekly, Monday morning UTC. Change to '17 6 * * *' for daily; the gate
    # keeps a no-op run quiet either way.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Open a PR even when no Temporal-relevant tests changed'
        type: boolean
        default: false

# Read-only default. Only `publish` raises this, and only for itself.
permissions:
  contents: read

env:
  TZ: 'America/New_York'
  PR_BRANCH: ci/test262-bump
  TEST262_REPO: https://github.com/tc39/test262.git

jobs:
  test:
    name: Run the suite against the latest test262
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      relevant: ${{ steps.gate.outputs.relevant }}
      old: ${{ steps.sha.outputs.old }}
      new: ${{ steps.sha.outputs.new }}
      changed_all: ${{ steps.gate.outputs.changed_all }}
      changed_surface: ${{ steps.gate.outputs.changed_surface }}
      status: ${{ steps.test262.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No credentials. This job executes third-party test code, and the
          # default `persist-credentials: true` would leave a token in
          # .git/config where that code could read it.
          persist-credentials: false
        # No submodules either. The gate below runs without them.

      - name: Resolve pinned and latest test262 commits
        id: sha
        run: |
          old=$(git ls-tree HEAD test262 | awk '{ print $3 }')
          new=$(git ls-remote "$TEST262_REPO" refs/heads/main | cut -f1)
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Pinned: $old"
          echo "Latest: $new"

      # The gate.
      #
      # A blobless clone carries every tree but no file contents, which is all
      # `git diff --name-only` needs. Measured at about 30 MB and 20 s, against
      # 239 MB for a full test262 checkout. That is cheap enough to run before
      # deciding anything, which is what lets the job stay silent.
      #
      # The paths below are the runner's real test surface, read out of
      # @js-temporal/temporal-test262-runner rather than guessed. With an empty
      # `testGlobs` it globs test/**/Temporal/**, test/intl402/DateTimeFormat/**
      # and test/built-ins/Date/p*/toTemporalInstant/*, and it reads helpers out
      # of harness/ for each test's `includes`.
      #
      # A bump that touches nothing in that surface cannot change our result,
      # so it is not worth a PR.
      #
      # The `if:` guard matters beyond saving a clone. When old == new there is
      # nothing to commit, and a forced run would reach `git commit` with an
      # empty index and fail.
      - name: Decide whether the bump can change our result
        id: gate
        if: steps.sha.outputs.old != steps.sha.outputs.new
        run: |
          git clone --filter=blob:none --no-checkout --quiet \
            "$TEST262_REPO" /tmp/test262-gate
          cd /tmp/test262-gate
          git diff --name-only \
            "${{ steps.sha.outputs.old }}" "${{ steps.sha.outputs.new }}" \
            > /tmp/changed-all.txt
          grep -E '^(harness/|test/.*/Temporal/|test/intl402/DateTimeFormat/|test/built-ins/Date/p[^/]*/toTemporalInstant/)' \
            /tmp/changed-all.txt > /tmp/changed-surface.txt || true
          all=$(wc -l < /tmp/changed-all.txt | tr -d '[:space:]')
          surface=$(wc -l < /tmp/changed-surface.txt | tr -d '[:space:]')
          echo "changed_all=$all" >> "$GITHUB_OUTPUT"
          echo "changed_surface=$surface" >> "$GITHUB_OUTPUT"
          echo "$all file(s) changed upstream, $surface of them in our test surface"
          if [ "$surface" -gt 0 ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in our test surface moved. Leaving the pin alone."
          fi

      - name: Check out submodules
        if: steps.gate.outputs.relevant == 'true'
        run: git submodule update --init --recursive

      - name: Bump the test262 submodule
        if: steps.gate.outputs.relevant == 'true'
        # The clone above is full, so the target commit is already present.
        run: git -C test262 checkout --quiet "${{ steps.sha.outputs.new }}"

      - name: Setup PNPM
        if: steps.gate.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6
        with:
          # NOTE: keep synced with ci.yml
          version: 10.20.0

      - name: Setup Node
        if: steps.gate.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          # NOTE: keep synced with .npmrc
          node-version: 22.14.0
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.gate.outputs.relevant == 'true'
        run: pnpm install

      - name: Build
        # From the repo root, not polyfill/: polyfill depends on the
        # temporal-utils workspace package building first.
        if: steps.gate.outputs.relevant == 'true'
        run: pnpm run build

      - name: Test 262 Full
        if: steps.gate.outputs.relevant == 'true'
        id: test262
        run: |
          set -o pipefail
          mkdir -p /tmp/report
          status=0
          # From polyfill/ so --no-max reaches the runner; `pnpm -r run` at the
          # root does not forward the flag. --no-max because a report wants the
          # whole list, where CI wants the default early abort.
          cd polyfill
          TEST262_CLASS_API=full pnpm run test262 --no-max \
            2>&1 | tee /tmp/report/test262.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

          # Clean the summary HERE, in the unprivileged job, so `publish` only
          # ever cats a file it does not have to reason about. Three passes:
          #
          # 1. Strip ANSI escapes. Observed reaching the PR body verbatim on a
          #    real Actions run, so this is measured rather than predicted.
          # 2. Drop the slow-test list, which is runner-speed noise that grows
          #    every run. It prints after the FAIL blocks and both warnings and
          #    before the counts, so cutting it cannot hide a failure.
          # 3. Neutralise code-fence markers. Test file names and error strings
          #    come from the same untrusted upstream, and an embedded fence
          #    would close the block early and render as markdown.
          sed -n '/Summary of results/,$p' /tmp/report/test262.log \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | sed '/The following tests took a long time:/,/tests finished in/{
                     /tests finished in/!d
                   }' \
            | sed -E 's/^[[:space:]]*(`{3,}|~{3,})/[fence] /' \
            > /tmp/report/summary.log

          # No summary means the runner died before finishing. Show the tail so
          # the report still says something useful.
          if [ ! -s /tmp/report/summary.log ]; then
            echo 'The runner produced no summary. Last 50 lines:' \
              > /tmp/report/summary.log
            tail -50 /tmp/report/test262.log \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | sed -E 's/^[[:space:]]*(`{3,}|~{3,})/[fence] /' \
              >> /tmp/report/summary.log
          fi
          exit 0

      - name: Upload the report
        if: steps.gate.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test262-report
          path: /tmp/report

  publish:
    name: Open the pull request
    needs: test
    if: needs.test.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    # The only job that can write. It runs no third-party code: no submodule
    # checkout, no `pnpm install`, no test run. Because it never installs,
    # lefthook is never installed either, so no git hook runs against the bot's
    # commit or push.
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      GH_TOKEN: ${{ github.token }}
      OLD: ${{ needs.test.outputs.old }}
      NEW: ${{ needs.test.outputs.new }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the report
        uses: actions/download-artifact@v8
        with:
          name: test262-report
          path: report

      # The report goes out three ways, so nothing is lost when the token
      # cannot do everything:
      #
      #   1. the job summary, which needs no permissions
      #   2. a pushed branch, which needs `contents: write`
      #   3. a PR, or failing that an issue
      #
      # A failed run is a poor notification: it depends on each user's Actions
      # settings, and for a scheduled run it aims at whoever last edited this
      # file rather than at the repo owner. An issue notifies the repo's
      # watchers either way, which is why it is the fallback and the red run is
      # only the floor beneath it.
      - name: Report, push the branch, and open the PR
        run: |
          if [ "${{ needs.test.outputs.status }}" = "0" ]; then
            verdict='The suite passes on this lane, so no expected-failure changes are needed for it.'
          else
            verdict='**The suite fails on this lane.** Each failure below needs a decision: fix it, or add it to the matching list in `polyfill/scripts/test262-expected-failures/`. The runner picks which list applies from the Node version and the class API, and most of those files open with the category they hold.'
          fi

          {
            echo "Bumps the \`test262\` submodule and reports the result."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Previous | \`$OLD\` |"
            echo "| New | \`$NEW\` |"
            echo "| Files changed upstream | ${{ needs.test.outputs.changed_all }} |"
            echo "| ...within our test surface | ${{ needs.test.outputs.changed_surface }} |"
            echo
            echo "[Compare on tc39/test262](https://github.com/tc39/test262/compare/$OLD...$NEW)"
            echo
            echo "$verdict"
            echo
            echo '> **One lane only.** This runs Node 22.14.0, `full` class API,'
            echo '> unminified. It never loads `native.txt`, `calendar*.txt`,'
            echo '> `shim-node-lte16/18/20.txt` or `minified-function-length.txt`.'
            echo '> `ci.yml` runs the full matrix on push to `main` and has no'
            echo '> `pull_request` trigger, so this PR carries no checks.'
            echo '>'
            echo '> **Exit status is not the whole verdict.** The runner returns 0'
            echo '> in two cases that still need action: tests that pass'
            echo '> unexpectedly, and tests named in an expected-failure file that'
            echo '> no longer exist. Read the counts, not the status.'
            echo '>'
            echo "> **The \`$PR_BRANCH\` branch is force-pushed each run**, so commits"
            echo '> added to it are replaced. Closing this PR without merging'
            echo '> brings a new one next week, because the pin has not moved.'
            echo
            echo '## Test 262 Full, Node 22.14.0'
            echo
            echo '```'
            head -c 50000 report/summary.log
            echo
            echo '```'
            echo
            echo 'The full log is attached to this run as the `test262-report` artifact.'
          } > /tmp/pr-body.md

          # 1. The job summary. Always readable, needs nothing.
          cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"

          # 2. The branch. The gitlink moves without the submodule content, so
          # this job never fetches tc39/test262.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$PR_BRANCH"
          git update-index --cacheinfo "160000,$NEW,test262"
          git commit -m "update test262 to ${NEW:0:10}"

          # --force-with-lease so a commit somebody added to the branch is never
          # silently replaced. The lease needs the remote ref, and the checkout
          # above fetched only the default branch, so fetch it first. An absent
          # branch leaves `expect` empty, which correctly means "must not exist".
          # Fetch into an explicit remote-tracking ref, never FETCH_HEAD: the
          # checkout above already wrote FETCH_HEAD, so a failed fetch would
          # leave the default branch's SHA there and the lease would be wrong.
          if git fetch --quiet origin \
               "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH" 2>/dev/null; then
            expect=$(git rev-parse "refs/remotes/origin/$PR_BRANCH")
          else
            expect=''
          fi
          if ! git push --force-with-lease="$PR_BRANCH:$expect" \
                 origin "HEAD:$PR_BRANCH" 2> /tmp/push-err.txt; then
            {
              echo
              echo '### Could not push the branch'
              echo
              echo 'Either the token lacks `contents: write`, or somebody added a'
              echo "commit to \`$PR_BRANCH\` and the lease refused to replace it."
              echo
              echo '```'
              cat /tmp/push-err.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # 3. The PR.
          title="update test262 to ${NEW:0:10}"
          existing=$(gh pr list --head "$PR_BRANCH" --state open \
            --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" \
              --body-file /tmp/pr-body.md 2> /tmp/gh-err.txt && exit 0
          else
            gh pr create --base main --head "$PR_BRANCH" --title "$title" \
              --body-file /tmp/pr-body.md 2> /tmp/gh-err.txt && exit 0
          fi

          # 4. Fallback: an issue.
          export ISSUE_TITLE='test262 bump is ready, but Actions cannot open the pull request'
          compare_url="${{ github.server_url }}/${{ github.repository }}/compare/main...$PR_BRANCH?expand=1"
          {
            echo "The \`$PR_BRANCH\` branch is pushed and the suite has run."
            echo 'Only the pull request failed. The usual cause is that Settings >'
            echo 'Actions > General > "Allow GitHub Actions to create and approve'
            echo 'pull requests" is off, and a workflow `permissions:` block cannot'
            echo 'override that one. The command said:'
            echo
            echo '```'
            cat /tmp/gh-err.txt
            echo '```'
            echo
            echo "Open the PR in one click: $compare_url"
            echo
            echo '---'
            echo
            cat /tmp/pr-body.md
          } > /tmp/issue-body.md

          existing_issue=$(gh issue list --state open --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty' \
            || true)
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" \
              --body-file /tmp/issue-body.md 2> /tmp/issue-err.txt && exit 0
          else
            gh issue create --title "$ISSUE_TITLE" \
              --body-file /tmp/issue-body.md 2> /tmp/issue-err.txt && exit 0
          fi

          # No PR and no issue. The branch is pushed, so fail loudly and leave
          # the link where a human will find it.
          {
            echo
            echo '### Could not open a pull request or an issue'
            echo
            echo "The \`$PR_BRANCH\` branch is pushed, so nothing is lost."
            echo "Open the PR here: $compare_url"
            echo
            echo '```'
            cat /tmp/issue-err.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
